  msg.textContent = text;

  const button = document.createElement('button');

  button.type = 'button';
  button.textContent = label;
  button.addEventListener('click', onClick);
  const actions = document.querySelector('.chat-actions');
  actions.appendChild(button);
}

function getActiveLanguageCode() {
  return localStorage.getItem('findit-site-language') || localStorage.getItem('findit-chat-language') || 'en';
}

function translateNotificationMessage(message, languageCode) {
  if (languageCode === 'en') return message;

  const translations = {
    kn: {
      possibleMatch: (item, id, score) => `ಸಂಭಾವ್ಯ ಹೊಂದಾಣಿಕೆ: ${item} ನಿಮ್ಮ ವರದಿ #${id} ಗೆ ಹೊಂದಿಕೆಯಾಗಬಹುದು (${score}%).`,
      newClaim: id => `ವಸ್ತು #${id} ಗಾಗಿ ಹೊಸ ಕ್ಲೇಮ್ ಸಲ್ಲಿಸಲಾಗಿದೆ.`,
      claimStatus: (id, status) => `ನಿಮ್ಮ ಕ್ಲೇಮ್ #${id} ${status === 'approved' ? 'ಅನುಮೋದಿಸಲಾಗಿದೆ' : 'ತಿರಸ್ಕರಿಸಲಾಗಿದೆ'}.`,
      closedClaim: (id, itemId) => `ವಸ್ತು #${itemId} ಗಾಗಿ ಮತ್ತೊಂದು ಕ್ಲೇಮ್ ಅನುಮೋದನೆಯಾದ ಕಾರಣ ನಿಮ್ಮ ಕ್ಲೇಮ್ #${id} ಮುಚ್ಚಲಾಗಿದೆ.`,
      handover: (itemId, receiptId) => `ವಸ್ತು #${itemId} ಹಸ್ತಾಂತರವನ್ನು ದಾಖಲಿಸಲಾಗಿದೆ. ರಸೀದಿ #${receiptId} ಲಭ್ಯವಿದೆ.`,
      reminder: (id, item) => `ವಸ್ತು ${item} ಗಾಗಿ ನಿಮ್ಮ ಕ್ಲೇಮ್ #${id} ಇನ್ನೂ ಬಾಕಿಯಿದೆ.`
    },
    hi: {
      possibleMatch: (item, id, score) => `संभावित मिलान: ${item} आपकी रिपोर्ट #${id} से मेल खा सकता है (${score}%).`,
      newClaim: id => `आइटम #${id} के लिए नया दावा जमा किया गया है।`,
      claimStatus: (id, status) => `आपका दावा #${id} ${status === 'approved' ? 'स्वीकृत' : 'अस्वीकृत'} हुआ।`,
      closedClaim: (id, itemId) => `आइटम #${itemId} के लिए दूसरा दावा स्वीकृत होने के कारण आपका दावा #${id} बंद कर दिया गया।`,
      handover: (itemId, receiptId) => `आइटम #${itemId} का हस्तांतरण दर्ज किया गया। रसीद #${receiptId} उपलब्ध है।`,
      reminder: (id, item) => `आइटम ${item} के लिए आपका दावा #${id} अभी भी लंबित है।`
    }
  }[languageCode];
  if (!translations) return message;

  let match = message.match(/^Possible match: (.+) may match your report #(\d+) \((\d+(?:\.\d+)?)%\)\.$/);
  if (match) return translations.possibleMatch(match[1], match[2], match[3]);
  match = message.match(/^A new claim was submitted for item #(\d+)\.$/);
  if (match) return translations.newClaim(match[1]);
  match = message.match(/^Your claim #(\d+) was (approved|rejected)\.$/);
  if (match) return translations.claimStatus(match[1], match[2]);
  match = message.match(/^Your claim #(\d+) was closed because another claim for item #(\d+) was approved\.$/);
  if (match) return translations.closedClaim(match[1], match[2]);
  match = message.match(/^Handover for item #(\d+) was recorded\. Receipt #(\d+) is available\.$/);
  if (match) return translations.handover(match[1], match[2]);
  match = message.match(/^Reminder: your claim #(\d+) for (.+) is still pending\.$/);
  if (match) return translations.reminder(match[1], match[2]);
  return message;
}

function applyChatLanguage() {
  const languageCode = getActiveLanguageCode();
  const language = chatTranslations[languageCode] || chatTranslations.en;
  const siteText = siteTranslations[languageCode] || {};
  document.documentElement.lang = languageCode;
  document.getElementById('chatWelcome').textContent = language.welcome;
  document.getElementById('chatInput').placeholder = language.placeholder;
  document.getElementById('chatSendButton').textContent = language.send;
  document.getElementById('chatPrivacyNote').textContent = language.privacy;
  document.querySelectorAll('.quick-chip[data-chat-label]').forEach(button => {
    button.textContent = language[button.dataset.chatLabel];
  });
  document.querySelectorAll('[data-notification-message]').forEach(element => {
    element.textContent = translateNotificationMessage(element.dataset.notificationMessage, languageCode);
  });
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let textNode;
  while ((textNode = walker.nextNode())) {
    const parent = textNode.parentElement;
    if (!parent || parent.closest('.chat-widget') || parent.closest('[data-i18n]') || parent.closest('[data-i18n-placeholder]')) continue;
    if (!originalSiteText.has(textNode)) originalSiteText.set(textNode, textNode.nodeValue);
    const original = originalSiteText.get(textNode);
    const trimmed = original.trim().replace(/\s+/g, ' ');
    const start = original.search(/\S/);
    const end = original.search(/\s*$/);
    const translated = languageCode === 'en' ? trimmed : (siteText[trimmed] || trimmed);
    textNode.nodeValue = original.slice(0, start) + translated + original.slice(end);
  }
  document.querySelectorAll('[placeholder]').forEach(element => {
    if (!originalPlaceholders.has(element)) originalPlaceholders.set(element, element.placeholder);
    const original = originalPlaceholders.get(element);
    element.placeholder = siteText[original] || original;
  });
}

function formatChatText(template, values) {
  return template.replace(/\{(\w+)\}/g, (_match, key) => values[key] || '');
}

function resetClaimConversation() {
  chatFlow = null;
  selectedClaimItem = null;
  pendingClaimProof = '';
  pendingClaimLocation = '';
  pendingClaimTime = '';
  document.querySelectorAll('.chat-flow-action').forEach(button => button.remove());
}

async function selectClaimItem(item) {
  addMessage(item.name, 'user');
  await sendChatQuery('', 'claim-select', item.id);
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const value = input.value.trim();
  if (!value) return;
  addMessage(value, 'user');
  input.value = '';
  const normalized = value.toLowerCase();
  if (chatFlow === 'claim-search' && (
    normalized.includes('office') ||
    normalized.includes('i lost') ||
    normalized.includes('lost my') ||
    normalized.includes('report a') ||
    normalized.startsWith('show found')
  )) {
    resetClaimConversation();
  }
  if (chatFlow === 'claim-proof') {
    pendingClaimProof = value;
    chatFlow = 'claim-lost-location';
    const language = chatTranslations[getActiveLanguageCode()] || chatTranslations.en;
    addMessage(language.where, 'bot');
    return;
  }
  if (chatFlow === 'claim-lost-location') {
    pendingClaimLocation = value;
    chatFlow = 'claim-lost-when';
    const language = chatTranslations[getActiveLanguageCode()] || chatTranslations.en;
    addMessage(language.when, 'bot');
    return;
  }
  if (chatFlow === 'claim-lost-when') {
    pendingClaimTime = value;
    chatFlow = 'claim-confirm';
    const language = chatTranslations[getActiveLanguageCode()] || chatTranslations.en;
    addMessage(formatChatText(language.confirmation, {
      item: selectedClaimItem.name,
      proof: pendingClaimProof,
      location: pendingClaimLocation,
      time: pendingClaimTime
    }), 'bot');
    addChatButton(language.yes, submitChatClaim);
    addChatButton(language.cancel, cancelChatClaim);
    return;
  }
  if (chatFlow === 'claim-confirm') {
    if (/^(yes|yes, submit|submit|confirm)$/i.test(value)) {
      submitChatClaim();
    } else if (/^(no|cancel|no, cancel)$/i.test(value)) {
      cancelChatClaim();
    } else {
      const language = chatTranslations[getActiveLanguageCode()] || chatTranslations.en;
      addMessage(formatChatText(language.confirmPrompt, {yes: language.yes, cancel: language.cancel}), 'bot');
    }
    return;
  }
  sendChatQuery(value);
}

async function sendChatQuery(text, flow = chatFlow, itemId = null) {
  try {
    const response = await fetch('{{ url_for("chatbot") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        flow,
        item_id: itemId,
        language: getActiveLanguageCode(),
        history: aiChatHistory
      })
    });
    const data = await response.json();
    addMessage(data.answer || 'I could not process that request.');
    if (data.ai_generated && text) {
      aiChatHistory.push(
        { role: 'user', content: text },
        { role: 'assistant', content: data.answer }
      );
      aiChatHistory = aiChatHistory.slice(-10);
    }
    chatFlow = data.next_step || null;
    if (data.claim_item) selectedClaimItem = data.claim_item;
    if (data.login_url) {
      const link = document.createElement('a');
      link.className = 'msg bot';
      link.href = data.login_url;
      link.textContent = 'Sign in to continue';
      document.getElementById('chatBody').appendChild(link);
    }
    (data.items || []).forEach(item => {
      const box = document.getElementById('chatBody');
      if (data.next_step === 'claim-select' && item.id) {
        const button = document.createElement('button');
        button.className = 'msg bot';
        button.type = 'button';
        button.textContent = `${item.name} · ${item.category} · ${item.location} · ${item.date} — Select`;
        button.addEventListener('click', () => selectClaimItem(item));
        box.appendChild(button);
      } else {
        const link = document.createElement('a');
        link.className = 'msg bot';
        link.href = item.url;
        link.textContent = `${item.name} · ${item.category} · ${item.location} · ${item.date}`;
        box.appendChild(link);
      }
      box.scrollTop = box.scrollHeight;
    });
  } catch (error) {
    addMessage('The item search is temporarily unavailable. Please try Browse Items.');
  }
}

function submitChatClaim() {
  if (!selectedClaimItem || !pendingClaimProof) return;
  const form = document.createElement('form');
  form.method = 'post';
  form.enctype = 'multipart/form-data';
  form.action = selectedClaimItem.claim_url;
  const proof = document.createElement('input');
  proof.type = 'hidden';
  proof.name = 'proof';
  proof.value = [
    `Item claimed: ${selectedClaimItem.name}`,
    `Ownership details: ${pendingClaimProof}`,
    `Where I last had the item: ${pendingClaimLocation}`,
    `When I lost the item: ${pendingClaimTime}`
  ].join('\n');
  form.appendChild(proof);
  document.body.appendChild(form);
  form.submit();
}

function cancelChatClaim() {
  chatFlow = null;
  selectedClaimItem = null;
  pendingClaimProof = '';
  pendingClaimLocation = '';
  pendingClaimTime = '';
  document.querySelectorAll('.chat-flow-action').forEach(button => button.remove());
  const language = chatTranslations[getActiveLanguageCode()] || chatTranslations.en;
  addMessage(language.cancelled);
}

document.getElementById('chatInput').addEventListener('keydown', function (event) {
  if (event.key === 'Enter') sendChatMessage();
});

document.querySelectorAll('.quick-chip').forEach(button => {
  button.addEventListener('click', () => {
    const msg = button.getAttribute('data-msg');
    resetClaimConversation();
    addMessage(msg, 'user');
    sendChatQuery(msg, null);
  });
});

function toggleChat() {
  document.getElementById('chatBox').classList.toggle('open');
}

function syncChatLanguageFromSite() {
  const lang = getActiveLanguageCode();
  localStorage.setItem('findit-chat-language', lang);
  applyChatLanguage();
}

syncChatLanguageFromSite();
window.addEventListener('storage', (event) => {
  if (event.key === 'findit-site-language') {
    syncChatLanguageFromSite();
  }
});
</script>
