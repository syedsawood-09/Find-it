{% extends "base.html" %}{% block title %}Login | FindIt{% endblock %}{% block content %}
<style>
  .auth-shell {
    max-width: 520px;
    margin: 48px auto 32px;
    padding: 36px 28px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(244,241,255,0.98));
    border: 1px solid rgba(91,76,240,0.12);
    box-shadow: 0 22px 60px rgba(35, 25, 78, 0.12);
  }
  .auth-shell h1 {
    margin-bottom: 12px;
    font-size: clamp(2rem, 4vw, 2.6rem);
  }
  .auth-sub {
    margin-bottom: 22px;
    color: var(--muted);
  }
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .auth-form .btn {
    margin-top: 14px;
    width: 100%;
    justify-content: center;
  }
  .auth-switch {
    text-align: center;
    margin-top: 18px;
    color: var(--muted);
  }
  .auth-switch a {
    color: var(--primary);
    font-weight: 700;
  }
</style>
<div class="auth-shell">
  <p class="eyebrow" data-i18n="welcomeBack">Welcome back</p>
  <h1 data-i18n="signIn">Sign in</h1>
  <p class="auth-sub" data-i18n="continueWorkflow">Continue your lost-item workflow and review updates from the campus team.</p>
  <form class="auth-form" method="post">
    <label data-i18n="identifierLabel">Email, mobile, or student ID</label>
    <input type="text" name="identifier" data-i18n-placeholder="identifierPlaceholder" placeholder="e.g. name@college.edu or 98765 43210 or 2024CS101" required>
    <label data-i18n="passwordLabel">Password</label>
    <input type="password" name="password" data-i18n-placeholder="passwordPlaceholder" placeholder="Enter your password" required>
    <button class="btn" type="submit" data-i18n="loginButton">Login</button>
  </form>
  <p class="auth-switch"><span data-i18n="newUser">New user?</span> <a href="{{ url_for('register') }}" data-i18n="createAccount">Create account</a></p>
</div>
{% endblock %}
